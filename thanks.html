<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Thank You | Muhammad Younas</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f8fafc;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --accent: #4f46e5;
            --accent-light: #eef2ff;
            --border: #e2e8f0;
        }

        [data-theme="dark"] {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --accent: #818cf8;
            --accent-light: #1e1b4b;
            --border: #334155;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            transition: background 0.2s, color 0.2s;
        }

        .thankyou-card {
            max-width: 500px;
            text-align: center;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 2rem;
            padding: 3rem 2rem;
            box-shadow: 0 20px 35px rgba(0,0,0,0.1);
        }

        .icon {
            font-size: 4rem;
            color: var(--accent);
            margin-bottom: 1rem;
        }

        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        p {
            color: var(--text-secondary);
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--accent);
            color: white;
            padding: 12px 28px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            transition: 0.2s;
            border: none;
            cursor: pointer;
        }

        .btn:hover {
            background: #6366f1;
            transform: translateY(-2px);
        }

        .theme-toggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 500;
            z-index: 100;
        }

        @media (max-width: 500px) {
            .thankyou-card { padding: 2rem 1.5rem; }
            h1 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="thankyou-card">
        <div class="icon">
            <i class="fa-regular fa-circle-check"></i>
        </div>
        <h1>Thank You! 🙌</h1>
        <p>Your message has been sent successfully.<br>I'll get back to you within 24 hours.</p>
        <a href="index.html" class="btn">
            <i class="fa-solid fa-arrow-left"></i> Back to Portfolio
        </a>
    </div>

    <button class="theme-toggle" id="themeToggleBtn">🌙 Dark Mode</button>

    <script>
        // Theme toggle
        const html = document.documentElement;
        const btn = document.getElementById('themeToggleBtn');
        function setTheme(theme) {
            html.setAttribute('data-theme', theme);
            localStorage.setItem('thankyou-theme', theme);
            btn.innerHTML = theme === 'dark' ? '☀️ Light Mode' : '🌙 Dark Mode';
        }
        const saved = localStorage.getItem('thankyou-theme') || 'light';
        setTheme(saved);
        btn.addEventListener('click', () => {
            const cur = html.getAttribute('data-theme');
            setTheme(cur === 'dark' ? 'light' : 'dark');
        });
    </script>
</body>
</html>
